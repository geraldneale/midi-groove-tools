# Groovelab26 visuals show file.
# Paths are relative to this file. Run: python3 vis_render.py show.toml

[midi]
port = "MPC"            # part of the MIDI port name (python3 vis_render.py --list-ports); "FakeMPC" for rehearsal
visual_channel = 16     # MPC track carrying scene notes, CCs and program changes
drum_channel = 10       # drum track the kick/snare/hat reactions listen to
kick_notes = [36]
snare_notes = [38, 40]
hat_notes = [42, 44, 46]

[output]
width = 1920            # fixed render size; rehearsal and gig look identical
height = 1080
preview_width = 1280    # rehearsal window size on the iMac
fullscreen = false
display = 0             # projector is usually 1
fps = 60
offset_ms = 0           # projector lag compensation, set at soundcheck (see README)
pulse_source = "kick"   # "kick" = follow kick notes, "beat" = follow MIDI clock
fallback = "art/fallback.png"   # shown before the first scene and if MIDI goes silent
idle_seconds = 5
crossfade = 0.25        # seconds between scenes
mirror_bars = 8         # color mirroring: bars for the true hues to travel once round (0 = hold still)
keep_white = 0.92       # near whites (this light or lighter) keep their own look while colors turn; 0 = off
fit = "contain"         # contain = whole piece with black around it; cover = fill the frame, cropping

# CC number on the visual channel for each effect
[cc]
zoom = 1        # how hard the kick punches the zoom
hue = 2         # color rotation
kaleido = 3     # 0 = off, up = more mirror segments
feedback = 4    # trails / tunnel
rgb_split = 5   # chromatic split
brightness = 7
drift = 8       # slow pan on stills
shimmer = 9     # hat driven split
mirror = 10     # color mirroring amount (Bram Cohen's okhsl mirror); 0 = true colors
true_angle = 11 # where the true hue pair sits; with mirror_bars = 0 this aims it on cue

# values used until a CC arrives (0.0 to 1.0)
[cc_defaults]
zoom = 0.5
brightness = 1.0
drift = 0.5
shimmer = 0.3
mirror = 1.0    # full color mirroring from the start

# The shuffle fills gaps between fixed scenes, like SoundTrack: put a shuffle note on the
# MPC's visual track with its velocity set to the gap's length in bars. It chains clips
# from clips/ and pictures from art/ (anything dropped in either folder joins; subfolders
# like art/misc don't), least shown first, new arrivals more often at first. Counts and
# the never-again list are kept in shuffle.db next to this file. In the visuals window,
# N skips the piece on screen and X drops it for good; the skip note does the same as N.
[shuffle]
note = 60
skip_note = 61
image_bars = 16         # how long a picture stays up (16 bars: two full turns of the color mirroring)
max_clip_bars = 16      # longest a clip plays before the next piece
skip_fade_beats = 1     # fade when skipping

# One [[song]] per MPC program change number. Items map a note on the
# visual channel to an image or a video clip. Velocity sets intensity.
[[song]]
program = 0
name = "Song 1"

  [[song.item]]
  note = 36
  type = "image"
  path = "art/piece01.png"

  [[song.item]]
  note = 37
  type = "image"
  path = "art/piece02.png"
  fit = "cover"        # any item can override the fit above

  [[song.item]]
  note = 38
  type = "clip"
  path = "clips/example.mp4"
  start = 0.0          # seconds into the file
  end = 8.0            # loops start..end
  bpm = 120            # clip's own tempo: playback speeds up or slows to the band

  [[song.item]]
  note = 39
  type = "image"
  path = "art/piece03.png"
  hold = true          # goes to black when the note ends
  gain = 0.8

  # Fractals are drawn live, no file needed. Each trigger starts them fresh.
  [[song.item]]
  note = 40
  type = "mandelbrot"
  spot = "seahorse"    # or "spiral", or center = [x, y]
  dive_bars = 16       # bars to dive in; then it floats back out over the same and repeats
  max_zoom = 20000     # deepest zoom (up to 50000 before it breaks into blocks)
  palette = "okhsl"    # okhsl (steady lightness, Bram Cohen style), or rainbow, fire, ice, acid
  color_bars = 4       # colors cycle once every this many bars

  [[song.item]]
  note = 41
  type = "julia"
  morph_bars = 32      # one full trip through its shapes
  start = 0.5          # where the trip begins (0.5 = the solid blob)
  palette = "okhsl"
  lightness = 0.7      # okhsl only: 0.05 dark to 0.95 pale; saturation = 0.9 also adjustable
  # also: radius (0.7885), zoom (1.0), iterations, resolution (0.25 to 1, lower for older laptops)

[[song]]
program = 1
name = "Song 2"

  [[song.item]]
  note = 36
  type = "image"
  path = "art/piece04.png"
